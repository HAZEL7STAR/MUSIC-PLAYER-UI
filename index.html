<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MUSIC PLAYER UI</title>
    <link rel="stylesheet" href="music.css">
</head>
<body>

    <h1>MUSIC PLAYER UI.</h1>

    <main class="player-page">

        <section id="music-player">
            <h2>Music Player</h2>
            <br>

            <figure class="cover">
                <div class="cover-box"> <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSZFl6yvunPmlAC8E_RBSDzjI43qoGYqrA_1A&s"></div>
            </figure>
            <br>
            <p class="song-name"><strong>NO ERA AMOR</strong></p>
            <p class="song-artist">DS Asul</p>

            <div class="time-row">
                <span>1:25</span>
                <span>3:45</span>
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

            <div class="controls">
                <button class="btn small">⏮</button>
                <button class="btn main">▶</button>
                <button class="btn small">⏭</button>
            </div>

            <div class="extra-options">
                <span>🔁</span>
                <span>🔀</span>
                <span>🔊</span>
            </div>
        </section>

    </main>

</body>
</html>
